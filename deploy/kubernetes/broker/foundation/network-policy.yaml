apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-broker-default-deny
spec:
  podSelector: {}
  policyTypes:
    - Ingress
    - Egress
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-broker-api-ingress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              enrichedlab.ai/broker-edge: "true"
          podSelector:
            matchLabels:
              enrichedlab.ai/broker-edge: "true"
      ports:
        - port: 32110
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-broker-dns-egress
spec:
  podSelector: {}
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - port: 53
          protocol: UDP
        - port: 53
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-broker-api-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: api
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              enrichedlab.ai/broker-database: "true"
          podSelector:
            matchLabels:
              enrichedlab.ai/broker-database: "true"
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              enrichedlab.ai/access-jwks-proxy: "true"
          podSelector:
            matchLabels:
              enrichedlab.ai/access-jwks-proxy: "true"
      ports:
        - port: 8443
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-broker-worker-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: worker
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              enrichedlab.ai/broker-database: "true"
          podSelector:
            matchLabels:
              enrichedlab.ai/broker-database: "true"
      ports:
        - port: 5432
          protocol: TCP
    - to:
        - namespaceSelector:
            matchLabels:
              enrichedlab.ai/openshell-gateway: "true"
          podSelector:
            matchLabels:
              enrichedlab.ai/openshell-gateway: "true"
      ports:
        - port: 8080
          protocol: TCP
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: agent-broker-database-admin-egress
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/component: database-admin
  policyTypes:
    - Egress
  egress:
    - to:
        - namespaceSelector:
            matchLabels:
              enrichedlab.ai/broker-database: "true"
          podSelector:
            matchLabels:
              enrichedlab.ai/broker-database: "true"
      ports:
        - port: 5432
          protocol: TCP
