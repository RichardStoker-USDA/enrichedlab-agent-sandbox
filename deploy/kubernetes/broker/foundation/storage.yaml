apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-broker-controller
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 50Gi
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: agent-broker-artifacts
spec:
  accessModes:
    - ReadWriteOnce
  resources:
    requests:
      storage: 100Gi
