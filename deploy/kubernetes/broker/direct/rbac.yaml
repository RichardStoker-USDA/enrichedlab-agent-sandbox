apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-broker-direct-worker
rules:
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["create", "get", "delete"]
  - apiGroups: [""]
    resources: ["persistentvolumeclaims", "pods"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-broker-direct-worker
subjects:
  - kind: ServiceAccount
    name: agent-broker-direct-worker
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-broker-direct-worker
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: agent-broker-custodian
rules:
  - apiGroups: [""]
    resources: ["persistentvolumeclaims"]
    verbs: ["create", "get", "patch"]
  - apiGroups: [""]
    resources: ["secrets", "services"]
    verbs: ["create"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["create", "get", "list"]
  - apiGroups: [""]
    resources: ["pods/log"]
    verbs: ["get"]
  - apiGroups: ["batch"]
    resources: ["jobs"]
    verbs: ["create", "get", "delete"]
  - apiGroups: ["networking.k8s.io"]
    resources: ["networkpolicies"]
    verbs: ["create"]
  - apiGroups: ["agents.x-k8s.io"]
    resources: ["sandboxes"]
    verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: agent-broker-custodian
subjects:
  - kind: ServiceAccount
    name: agent-broker-custodian
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: Role
  name: agent-broker-custodian
