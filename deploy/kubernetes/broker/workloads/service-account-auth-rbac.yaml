# Optional private-overlay input. It is deliberately not referenced by the public
# workloads kustomization, so ServiceAccount request authentication stays disabled
# until a site adds both this binding and a validated private configuration file.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: agent-broker-tokenreview
rules:
  - apiGroups: ["authentication.k8s.io"]
    resources: ["tokenreviews"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: agent-broker-api-tokenreview
subjects:
  - kind: ServiceAccount
    name: agent-broker-api
    namespace: enrichedlab-agent-system
roleRef:
  apiGroup: rbac.authorization.k8s.io
  kind: ClusterRole
  name: agent-broker-tokenreview
