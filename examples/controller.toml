schema_version = 3
dashboard_bind = "127.0.0.1:32100"
default_profile = "development"
default_route = "none"
git_committer_name = "agent-sandbox host integrator"
git_committer_email = "agent-sandbox@localhost.invalid"
custom_auto_approve_loopback_services = false
custom_auto_approve_catalog_entries = false
require_hard_landlock = true
ocsf_json_enabled = true
policy_advisor_enabled = true
default_gateway_profile = "docker-local"

[provenance]
backend = "embedded"
tenant_id = "local"
postgres_dsn_env = "AGENT_SANDBOX_POSTGRES_DSN"
postgres_migration_dsn_env = "AGENT_SANDBOX_POSTGRES_MIGRATION_DSN"
evidence_lease_seconds = 300
evidence_preview_bytes = 65536

[gateway_profiles.docker-local]
enabled = true
required = true
openshell_gateway = "openshell"
driver = "docker"
workspace_transport = "bind"
bind_mounts_enabled = true
sync_max_files = 100000
sync_max_bytes = 21474836480

[gateway_profiles.docker-local.kubernetes]
tolerations = []

[gateway_profiles.docker-local.kubernetes.node_selector]

[gateway_profiles.vm-local]
enabled = false
required = false
openshell_gateway = "vm"
driver = "vm"
workspace_transport = "sync"
bind_mounts_enabled = false
sync_max_files = 100000
sync_max_bytes = 21474836480

[gateway_profiles.vm-local.kubernetes]
tolerations = []

[gateway_profiles.vm-local.kubernetes.node_selector]

[gateway_profiles.kubernetes-kata]
enabled = false
required = false
openshell_gateway = "kubernetes"
driver = "kubernetes"
workspace_transport = "sync"
bind_mounts_enabled = false
sync_max_files = 100000
sync_max_bytes = 21474836480

[gateway_profiles.kubernetes-kata.kubernetes]
runtime_class_name = "kata-qemu"
tolerations = []

[gateway_profiles.kubernetes-kata.kubernetes.node_selector]
"sandbox.example/runtime-kata" = "qualified"

[gateway_profiles.kubernetes-kata.observer]
transport = "local"
command = ["kubectl"]
namespace = "agent-sandboxes"
ssh_bin = "ssh"
manage_peer_network_policies = false
